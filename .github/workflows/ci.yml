name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation -e .
      - run: ruff check src tests alpha_report.py beta_report_send_email.py
      - run: ruff format --check src tests alpha_report.py beta_report_send_email.py
      - run: python -m pytest --cov=class_report --cov-report=term-missing
      - run: python -m build --no-isolation
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: class-report examples/alpha.xlsx -o /tmp/alpha-reports
      - run: class-report examples/beta.xlsx --stage beta -o /tmp/beta-reports
